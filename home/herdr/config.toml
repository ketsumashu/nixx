onboarding = false

[terminal]
default_shell = "fish"

[experimental]
kitty_graphics = true

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+a"

[[keys.command]]
key = "prefix+]"
type = "popup"
command = "lazygit"
description = "Open LazyGit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec fish"
description = "Open shell"
width = "80%"
height = "80%"

[theme]
name = "terminal"
auto_switch = false

[ui]
hide_tab_bar_when_single_tab = true
sidebar_collapsed_mode = "hidden"
sidebar_start_collapsed = true
sidebar_width = 15
sidebar_min_width = 15
show_agent_labels_on_pane_borders = true

[theme.custom]
accent = "#69dbaf"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "#2a2a2a"
selection_bg = "#353535"
surface0 = "#2a2a2a"
surface1 = "#353535"
surface_dim = "#131313"
overlay0 = "#919191"
overlay1 = "#c6c6c6"
text = "#e2e2e2"
subtext0 = "#c6c6c6"
mauve = "#69dbaf"
green = "#69dbaf"
yellow = "#b3ccbf"
red = "#ffb4ab"
blue = "#a6cce0"
teal = "#b3ccbf"
peach = "#ffdeab"
